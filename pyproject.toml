[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-guard"
version = "0.1.0"
description = "Ask a DuckDB database questions in plain English. The LLM proposes SQL; only validated, read-only SQL runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehul Gupta" }]
dependencies = ["duckdb>=0.10", "sqlglot>=23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
